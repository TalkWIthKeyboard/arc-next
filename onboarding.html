<!doctype html>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>Welcome to arc-next</title>
<link rel="icon" href="icons/icon32.png">
<style>
  /* Same paper, card and blue as the popup and the command bar. */
  @font-face { font-family: "Instrument Serif"; src: url(fonts/InstrumentSerif.woff2) format("woff2"); }
  :root { --bg: #fbf8f1; --dots: #d6cfbd; --panel: #fff; --rim: #fff; --drop: rgb(30 30 60 / .22);
    --fg: #17182a; --dim: #5a5d6b; --line: #e3dccb; --accent: #1f66ff; --on-accent: #fff; --soft: #e6eeff;
    --rail: #f1ece1; --row: #e3dccb; --key: #f4efe4;
    --ok: #17804a; --ok-soft: #e2f4ea; --coral: #e8455a; --sky: #5aa2ff; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1d23; --dots: #34363f; --panel: #272932; --rim: #33353f; --drop: rgb(0 0 0 / .6);
      --fg: #ecebe6; --dim: #a3a5b3; --line: #3a3c47; --accent: #7aa5ff; --on-accent: #14151a; --soft: #2a3550;
      --rail: #23242b; --row: #3a3c47; --key: #1c1d23;
      --ok: #6fd39b; --ok-soft: #1c3329; --coral: #ff7a8a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px 20px; background: var(--bg) radial-gradient(var(--dots) 1px, transparent 1.2px) 0 0 / 16px 16px; color: var(--fg);
    font: 400 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  main { width: min(880px, 100%); background: var(--panel); border: 4px solid var(--rim); border-radius: 22px; padding: 30px 32px;
    display: flex; flex-direction: column; gap: 26px; box-shadow: 0 3px 0 rgb(0 0 0 / .04), 0 24px 60px var(--drop); }
  .top { display: flex; align-items: center; gap: 12px; }
  .top strong { font: 400 30px/1 "Instrument Serif", Georgia, serif; }
  .dots { margin-left: auto; display: flex; gap: 6px; }
  .dots i { width: 22px; height: 4px; border-radius: 2px; background: var(--line); }
  .dots i.on { background: var(--accent); }
  .stage { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 32px; align-items: center; min-height: 290px; }
  @media (max-width: 720px) { .stage { grid-template-columns: minmax(0, 1fr); } main { padding: 22px; } }
  .copy { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  h1 { margin: 0; font-size: 26px; line-height: 1.2; font-weight: 600; letter-spacing: -.01em; text-wrap: balance; }
  p { margin: 0; }
  ol { margin: 0; padding-left: 1.25em; display: flex; flex-direction: column; gap: 6px; }
  kbd { font: 600 13px/1 system-ui, sans-serif; padding: 4px 7px; border-radius: 6px; background: var(--key); border: 1px solid var(--line); white-space: nowrap; }
  .check { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--key); font-weight: 500; }
  .check .state { margin-left: auto; font-size: 13px; color: var(--dim); white-space: nowrap; }
  .check.done { background: var(--ok-soft); }
  .check.done .state { color: var(--ok); }
  .note { font-size: 13px; color: var(--dim); }
  .warn { padding: 12px 14px; border-radius: 10px; border: 1px solid var(--coral); font-size: 14px; }
  .warn b { color: var(--coral); }
  .actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  button { all: unset; box-sizing: border-box; cursor: pointer; padding: 10px 18px; border-radius: 999px; font-weight: 600; font-size: 14px; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .primary { background: var(--accent); color: var(--on-accent); }
  .primary:disabled { opacity: .4; cursor: default; }
  .ghost { color: var(--dim); }
  .link { color: var(--accent); padding-inline: 4px; }

  code { font: 12px/1.5 ui-monospace, Menlo, monospace; background: var(--key); padding: 2px 6px; border-radius: 5px; overflow-wrap: anywhere; }
  .drop { min-height: 250px; border: 2px dashed var(--line); border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; color: var(--dim); text-align: center; padding: 16px; }
  .drop:hover, .drop:focus-within { border-color: var(--accent); }
  .drop b { color: var(--fg); font-weight: 600; }
  .err { color: var(--coral); font-size: 13px; }
  .arc { border: 1px solid var(--line); border-radius: 12px; background: var(--bg); max-height: 320px; overflow-y: auto; padding: 6px 10px 10px; }
  .sp { display: flex; align-items: center; gap: 8px; font-weight: 600; padding: 8px 0 4px; cursor: pointer; }
  .sp input { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; }
  .sec { display: flex; align-items: center; gap: 8px; padding: 3px 0 3px 24px; font-size: 13px; }
  .sec.off { opacity: .45; }
  .sec span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sec i { font-style: normal; color: var(--dim); font-variant-numeric: tabular-nums; margin-right: auto; }
  select { font: inherit; font-size: 13px; color: var(--fg); background: var(--key); border: 1px solid var(--line); border-radius: 6px; padding: 2px 4px; }

  /* A small schematic browser window for each step. */
  .win { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--bg); display: grid; grid-template-columns: 38% 1fr; min-height: 250px; position: relative; }
  .win.top-tabs { grid-template-columns: 1fr; grid-template-rows: 34px 1fr; }
  .rail { background: var(--rail); padding: 10px 8px; display: flex; flex-direction: column; gap: 6px; }
  .tabs-top { background: var(--rail); display: flex; gap: 6px; padding: 7px 8px; align-items: center; }
  .tabs-top .t { height: 20px; width: 64px; }
  .t { height: 22px; border-radius: 6px; background: var(--row); display: flex; align-items: center; padding: 0 7px; font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden; }
  .hot { outline: 2px solid var(--coral); outline-offset: 1px; }
  .t.hot { color: var(--fg); }
  .pins { display: flex; gap: 6px; }
  .pin { width: 22px; height: 22px; border-radius: 6px; background: var(--row); flex: none; }
  .pin.on { background: var(--sky); }
  .grp { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 6px; background: var(--accent); color: var(--on-accent); align-self: flex-start; }
  .indent { margin-left: 8px; border-left: 2px solid var(--accent); padding-left: 6px; display: flex; flex-direction: column; gap: 6px; }
  .page { padding: 14px; display: flex; flex-direction: column; gap: 8px; position: relative; }
  .ln { height: 7px; border-radius: 4px; background: var(--row); }
  .menu { position: absolute; left: 30%; top: 28px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px; font-size: 11px; box-shadow: 0 8px 24px rgb(0 0 0 / .18); display: flex; flex-direction: column; gap: 1px; }
  .menu span { padding: 4px 9px; border-radius: 5px; color: var(--dim); white-space: nowrap; }
  .menu span.hot { background: var(--soft); color: var(--fg); font-weight: 600; }
  .bar { position: absolute; left: 12%; right: 12%; top: 26%; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px; box-shadow: 0 12px 32px rgb(0 0 0 / .22); display: flex; flex-direction: column; gap: 5px; }
  .bar .in { height: 24px; border-radius: 12px; background: var(--key); font-size: 11px; color: var(--dim); display: flex; align-items: center; padding: 0 10px; }
  .bar .r { height: 20px; border-radius: 0 10px 10px 0; display: flex; align-items: center; font-size: 11px; padding: 0 8px; color: var(--dim); margin-left: -8px; }
  .bar .r.sel { background: var(--soft); color: var(--fg); border-left: 3px solid var(--accent); }
  .mini { position: absolute; right: 10px; bottom: 10px; width: 38%; aspect-ratio: 16 / 9; border-radius: 8px; background: var(--fg); outline: 2px solid var(--coral); outline-offset: 1px; box-shadow: 0 8px 24px rgb(0 0 0 / .3); }
  .mini::after { content: ""; position: absolute; left: 50%; top: 50%; translate: -35% -50%; border: 9px solid transparent; border-left: 15px solid var(--panel); border-right: 0; }
  .hero { display: grid; place-items: center; min-height: 250px; }
  .hero img { width: 150px; height: 150px; }
</style>
<main id="app"></main>
<!-- content.js gives this page the same ⌘T overlay that ordinary web pages get. -->
<script src="content.js"></script>
<script type="module" src="onboarding.js"></script>
