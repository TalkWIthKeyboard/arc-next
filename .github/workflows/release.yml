# Pushing a tag like v0.1.0 builds arc-next.zip and publishes it as a GitHub release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag matches manifest.json
        run: |
          version=$(jq -r .version manifest.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the manifest version $version"
            exit 1
          fi

      - name: Build the ZIP
        run: npm run zip

      - name: Publish the release
        run: gh release create "$GITHUB_REF_NAME" arc-next.zip --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
